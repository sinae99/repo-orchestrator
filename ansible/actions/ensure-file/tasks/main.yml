---
# Action: ensure-file (write)
# Creates a standard file in every repo (CODEOWNERS, .editorconfig, …).
# Operates on every workspace repo — not only scan matches.
# Tip: set target_patterns to the same path so 04-scan.json shows who already has it.
# Honors --dry-run.
#
# Params:
#   path       (required) — path inside each repo
#   content    — literal contents (or use src)
#   src        — local template file to copy
#   overwrite  (optional) — enforce contents (default false = create if missing)
#   mode       (optional) — default "0644"

- name: Ensure-file | require params
  ansible.builtin.assert:
    that:
      - reporker_action.params is defined
      - reporker_action.params.path is defined
      - reporker_action.params.path | length > 0
      - (reporker_action.params.content is defined) or (reporker_action.params.src is defined)
    fail_msg: "Set reporker_action.params.path and one of params.content or params.src for the ensure-file action."
    quiet: true

- name: Ensure-file | resolve params
  ansible.builtin.set_fact:
    _ef_path: "{{ reporker_action.params.path }}"
    _ef_content: "{{ reporker_action.params.content | default(none) }}"
    _ef_src: "{{ reporker_action.params.src | default(none) }}"
    _ef_overwrite: "{{ reporker_action.params.overwrite | default(false) | bool }}"
    _ef_mode: "{{ reporker_action.params.mode | default('0644') }}"
    _ef_repos: "{{ targets_by_repo | list }}"

- name: Ensure-file | create parent directories
  ansible.builtin.file:
    path: "{{ (item ~ '/' ~ _ef_path) | dirname }}"
    state: directory
    mode: "0755"
  loop: "{{ _ef_repos }}"

- name: Ensure-file | write the file into each repo
  ansible.builtin.copy:
    dest: "{{ item }}/{{ _ef_path }}"
    content: "{{ _ef_content if _ef_content is not none else omit }}"
    src: "{{ _ef_src if _ef_src is not none else omit }}"
    force: "{{ _ef_overwrite }}"
    mode: "{{ _ef_mode }}"
  loop: "{{ _ef_repos }}"
  register: _ef_results

# Derive paths from the loop item (repo dir) — in check mode, copy omits dest for new files.
- name: Ensure-file | set changed_files from results
  ansible.builtin.set_fact:
    changed_files: >-
      {{
        _ef_results.results
        | selectattr('changed', 'defined')
        | selectattr('changed', 'equalto', true)
        | map(attribute='item')
        | map('regex_replace', '$', '/' ~ _ef_path)
        | list
      }}

- name: Ensure-file | build action report payload
  ansible.builtin.set_fact:
    _action_report:
      path: "{{ _ef_path }}"
      overwrite: "{{ _ef_overwrite }}"
      check_mode: "{{ ansible_check_mode }}"
      summary:
        repos_total: "{{ _ef_repos | length }}"
        files_written: "{{ changed_files | length }}"
      changed_files: "{{ changed_files }}"

- name: Ensure-file | write 03-action.json
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../actions/_shared/tasks/write_action_report.yml"

- name: Ensure-file | print summary
  ansible.builtin.debug:
    msg: >-
      {{ changed_files | length }} of {{ _ef_repos | length }} repo(s)
      {{ 'would get' if ansible_check_mode else 'got' }} {{ _ef_path }}
      → {{ paths.reports }}/{{ reporker_report.action }}
