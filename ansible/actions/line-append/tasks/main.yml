---
# Action: line-append
# Idempotently ensures a single line exists in every matched file. Running it
# twice changes nothing the second time — only files actually edited are
# reported in changed_files (so only those repos get published).
#
# Required params:
#   reporker_action.params.ensure_line   — the line to insert
# Optional params:
#   reporker_action.params.insertafter   — lineinfile insertafter (default: EOF)

- name: Line-append | require params.ensure_line
  ansible.builtin.assert:
    that:
      - reporker_action.params is defined
      - reporker_action.params.ensure_line is defined
      - reporker_action.params.ensure_line | length > 0
    fail_msg: "Set reporker_action.params.ensure_line in your config for the line-append action."

- name: Line-append | ensure line in each target
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    line: "{{ reporker_action.params.ensure_line }}"
    state: present
    insertafter: "{{ reporker_action.params.insertafter | default('EOF') }}"
  loop: "{{ all_targets }}"
  register: line_append_results
  when: all_targets | length > 0

- name: Line-append | set changed_files (none)
  ansible.builtin.set_fact:
    changed_files: []
  when: all_targets | length == 0

- name: Line-append | set changed_files from results
  ansible.builtin.set_fact:
    changed_files: >-
      {{
        line_append_results.results
        | selectattr('changed', 'defined')
        | selectattr('changed', 'equalto', true)
        | map(attribute='item')
        | list
      }}
  when: all_targets | length > 0
