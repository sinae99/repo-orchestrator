---
# Action: line-append (write)
# Idempotently ensures a line exists in every matched file.
#
# Params:
#   ensure_line  (required) — line to insert
#   insertafter  (optional) — lineinfile insertafter (default: EOF)

- name: Line-append | require params.ensure_line
  ansible.builtin.assert:
    that:
      - reporker_action.params is defined
      - reporker_action.params.ensure_line is defined
      - reporker_action.params.ensure_line | length > 0
    fail_msg: "Set reporker_action.params.ensure_line for the line-append action."

- name: Line-append | ensure line in each target
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    line: "{{ reporker_action.params.ensure_line }}"
    state: present
    insertafter: "{{ reporker_action.params.insertafter | default('EOF') }}"
  loop: "{{ all_targets }}"
  register: line_append_results
  when: all_targets | length > 0

- name: Line-append | set changed_files (none)
  ansible.builtin.set_fact:
    changed_files: []
  when: all_targets | length == 0

- name: Line-append | set changed_files from results
  ansible.builtin.set_fact:
    changed_files: >-
      {{
        line_append_results.results
        | selectattr('changed', 'defined')
        | selectattr('changed', 'equalto', true)
        | map(attribute='item')
        | list
      }}
  when: all_targets | length > 0

- name: Line-append | build action report payload
  ansible.builtin.set_fact:
    _action_report:
      summary:
        files_scanned: "{{ all_targets | length }}"
        files_changed: "{{ changed_files | length }}"
      ensure_line: "{{ reporker_action.params.ensure_line }}"
      changed_files: "{{ changed_files }}"

- name: Line-append | write 03-action.json
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../actions/_shared/tasks/write_action_report.yml"
