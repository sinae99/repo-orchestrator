---
# Action: priorityclass-ensure-medium
# Write action. For Kubernetes manifests whose pod template omits priorityClassName,
# add priorityClassName with the configured value (default: medium).
# Honors --dry-run (reporker action --dry-run) via Ansible check mode.
#
# Configure in group_vars:
#   reporker_action:
#     name: priorityclass-ensure-medium
#     target_patterns: ["*.yaml", "*.yml"]
#     params:
#       priority_class: medium
#
# Output:
#   02-breakdown.json
#   03-action.json

- name: PriorityClassEnsureMedium | resolve script paths
  ansible.builtin.set_fact:
    _pcem_script: "{{ playbook_dir }}/../actions/priorityclass-ensure-medium/files/ensure_medium.py"
    _pcem_class: "{{ reporker_action.params.priority_class | default('medium') }}"

- name: PriorityClassEnsureMedium | require PyYAML
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - import yaml
  changed_when: false

- name: PriorityClassEnsureMedium | debug scan start
  ansible.builtin.debug:
    msg: >-
      Processing {{ all_targets | length }} manifest(s);
      adding priorityClassName: {{ _pcem_class }} where absent

- name: PriorityClassEnsureMedium | write full priority breakdown report
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../actions/_shared/tasks/priority_breakdown.yml"

- name: PriorityClassEnsureMedium | load breakdown for targeting
  ansible.builtin.slurp:
    src: "{{ paths.reports }}/{{ reporker_report.breakdown }}"
  register: _pcem_breakdown_raw

- name: PriorityClassEnsureMedium | parse breakdown data
  ansible.builtin.set_fact:
    _pcem_breakdown: "{{ (_pcem_breakdown_raw.content | b64decode | from_json) }}"

- name: PriorityClassEnsureMedium | derive targets missing priorityClassName
  ansible.builtin.set_fact:
    _pcem_targets: "{{ _pcem_targets | default([]) + [item.file] }}"
  loop: "{{ _pcem_breakdown.by_manifest | default([]) }}"
  when:
    - item.templates is defined
    - item.templates | selectattr('explicit', 'equalto', false) | list | length > 0

- name: PriorityClassEnsureMedium | dedupe target manifests
  ansible.builtin.set_fact:
    _pcem_targets: "{{ _pcem_targets | default([]) | unique | list }}"

- name: PriorityClassEnsureMedium | set changed_files (none)
  ansible.builtin.set_fact:
    changed_files: []
  when: _pcem_targets | length == 0

- name: PriorityClassEnsureMedium | add priorityClassName in each matching manifest
  ansible.builtin.command:
    argv: "{{ ['python3', _pcem_script, item, '--priority-class', _pcem_class] + (['--check'] if ansible_check_mode else []) }}"
  loop: "{{ _pcem_targets }}"
  register: _pcem_results
  changed_when: false
  failed_when: false
  check_mode: false
  when: _pcem_targets | length > 0

- name: PriorityClassEnsureMedium | fail on script errors
  ansible.builtin.fail:
    msg: >-
      ensure_medium.py failed on {{ item.item }}
      (rc={{ item.rc }}): {{ item.stderr | default('') | trim }}
  loop: "{{ _pcem_results.results }}"
  when:
    - _pcem_targets | length > 0
    - item.rc | default(0) | int not in [0, 3]

- name: PriorityClassEnsureMedium | set changed_files from results
  ansible.builtin.set_fact:
    changed_files: "{{ changed_files | default([]) + [item.item] }}"
  loop: "{{ _pcem_results.results | default([]) }}"
  when:
    - _pcem_targets | length > 0
    - item.rc | default(0) | int == 3

- name: PriorityClassEnsureMedium | write action report
  check_mode: false
  ansible.builtin.copy:
    dest: "{{ paths.reports }}/{{ reporker_report.action }}"
    mode: "0644"
    content: |
      {{
        {
          "action": "priorityclass-ensure-medium",
          "rule": "add priorityClassName where pod templates omit it",
          "priority_class_added": _pcem_class,
          "check_mode": ansible_check_mode,
          "summary": {
            "total_manifests_scanned": all_targets | length,
            "manifests_missing_priorityClassName": _pcem_targets | default([]) | length,
            "manifests_changed": changed_files | length,
            "priority_breakdown": priority_breakdown_summary | default({})
          },
          "targets": _pcem_targets | default([]),
          "changed_files": changed_files,
          "breakdown_report": reporker_report.breakdown
        } | to_nice_json
      }}

- name: PriorityClassEnsureMedium | print summary
  ansible.builtin.debug:
    msg: >-
      {{ changed_files | length }} of {{ _pcem_targets | default([]) | length }} manifest(s)
      missing priorityClassName
      {{ 'would change' if ansible_check_mode else 'changed' }}
      (scanned {{ all_targets | length }} total)
      → {{ paths.reports }}/{{ reporker_report.action }}
      · breakdown → {{ paths.reports }}/{{ reporker_report.breakdown }}
