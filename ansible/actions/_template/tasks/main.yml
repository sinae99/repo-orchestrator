---
# Action: _template
#
# Copy to start a new action:
#   cp -r ansible/actions/_template ansible/actions/my-action
# Then set reporker_action.name: my-action in ansible/group_vars/all.yml.
#
# Provided by the engine before this file runs:
#   all_targets        — flat list of matched files (absolute paths)
#   targets_by_repo    — { repo_path: [file, ...] }, includes empty repos
#   repos_with_targets — repos that matched at least one file
#   reporker_action.params — custom params from config
#   paths.reports      — report output directory
#
# Contract:
#   1. (recommended) write 03-action.json via reporker_report.action
#   2. (required) set changed_files before finishing

- name: Template | resolve params
  ansible.builtin.set_fact:
    _tpl_greeting: "{{ reporker_action.params.greeting | default('hello from reporker') }}"

- name: Template | inspect targets
  ansible.builtin.debug:
    msg: "{{ _tpl_greeting }} — {{ all_targets | length }} file(s) matched."

- name: Template | build action report payload
  ansible.builtin.set_fact:
    _action_report:
      summary:
        repos_with_matches: "{{ repos_with_targets | length }}"
        total_files: "{{ all_targets | length }}"
      files_by_repo: "{{ targets_by_repo }}"

- name: Template | write 03-action.json
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../actions/_shared/tasks/write_action_report.yml"

- name: Template | set changed_files (read-only)
  ansible.builtin.set_fact:
    changed_files: []

