---
# Action: _template (read)
#
# Start a new action:
#   cp -r ansible/actions/_template ansible/actions/my-action
# Then edit meta.yml (set mode: read|write) and tasks/main.yml.
# Set reporker_action.name: my-action — or write a recipe under recipes/.
#
# Engine gives you:
#   all_targets, targets_by_repo, repos_with_targets
#   reporker_action.params, paths.reports
#
# Contract:
#   1. meta.yml with mode: read|write
#   2. write 03-action.json via _shared/tasks/write_action_report.yml
#   3. set changed_files ([] for read; absolute paths you changed for write)
#   4. respect --dry-run on write actions
#   5. header: # Action: <name> (read|write)
#   6. add a recipe under recipes/

- name: Template | resolve params
  ansible.builtin.set_fact:
    _tpl_greeting: "{{ reporker_action.params.greeting | default('hello from reporker') }}"

- name: Template | inspect targets
  ansible.builtin.debug:
    msg: "{{ _tpl_greeting }} — {{ all_targets | length }} file(s) matched."

- name: Template | build action report payload
  ansible.builtin.set_fact:
    _action_report:
      summary:
        repos_with_matches: "{{ repos_with_targets | length }}"
        total_files: "{{ all_targets | length }}"
      files_by_repo: "{{ targets_by_repo }}"

- name: Template | write 03-action.json
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../actions/_shared/tasks/write_action_report.yml"

- name: Template | set changed_files (read)
  ansible.builtin.set_fact:
    changed_files: []

