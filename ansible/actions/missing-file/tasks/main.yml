---
# Action: missing-file (read)
# Repos that do NOT match any target_patterns — inverse of inventory.
# No params; set target_patterns to the file you expect everywhere.

- name: Missing-file | split repos by presence of a match
  ansible.builtin.set_fact:
    _mf_present: >-
      {{
        targets_by_repo | dict2items
        | rejectattr('value', 'equalto', [])
        | map(attribute='key') | list
      }}
    _mf_missing: >-
      {{
        targets_by_repo | dict2items
        | selectattr('value', 'equalto', [])
        | map(attribute='key') | list
      }}

- name: Missing-file | build action report payload
  ansible.builtin.set_fact:
    _action_report:
      target_patterns: "{{ reporker_action.target_patterns | default([]) }}"
      content_grep: "{{ reporker_action.content_grep | default('') }}"
      summary:
        repos_scanned: "{{ targets_by_repo | length }}"
        repos_with_file: "{{ _mf_present | length }}"
        repos_missing_file: "{{ _mf_missing | length }}"
      repos_missing_file: "{{ _mf_missing | sort }}"
      repos_with_file: "{{ _mf_present | sort }}"

- name: Missing-file | write 03-action.json
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../actions/_shared/tasks/write_action_report.yml"

- name: Missing-file | print summary
  ansible.builtin.debug:
    msg: >-
      {{ _mf_missing | length }} of {{ targets_by_repo | length }} repo(s)
      are missing {{ reporker_action.target_patterns | default([]) | join(', ') }}
      → {{ paths.reports }}/{{ reporker_report.action }}

- name: Missing-file | set changed_files (read)
  ansible.builtin.set_fact:
    changed_files: []
