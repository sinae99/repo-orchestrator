---
# Action: missing-file
# Read-only governance audit. Reports which repos do NOT contain any file
# matching your target_patterns. The inverse of inventory — answer questions
# like "which repos have no LICENSE / .gitlab-ci.yml / CODEOWNERS / Dockerfile?".
#
# Just set target_patterns to the file you expect everywhere; no params needed.
#
# Output: ansible/reports/missing-file.json
# This action is read-only: changed_files is always [].

- name: Missing-file | split repos by presence of a match
  ansible.builtin.set_fact:
    _mf_present: >-
      {{
        targets_by_repo | dict2items
        | rejectattr('value', 'equalto', [])
        | map(attribute='key') | list
      }}
    _mf_missing: >-
      {{
        targets_by_repo | dict2items
        | selectattr('value', 'equalto', [])
        | map(attribute='key') | list
      }}

- name: Missing-file | write missing-file.json
  check_mode: false
  ansible.builtin.copy:
    dest: "{{ paths.reports }}/missing-file.json"
    mode: "0644"
    content: |
      {{
        {
          "action": "missing-file",
          "target_patterns": reporker_action.target_patterns | default([]),
          "content_grep": reporker_action.content_grep | default(''),
          "summary": {
            "repos_scanned": targets_by_repo | length,
            "repos_with_file": _mf_present | length,
            "repos_missing_file": _mf_missing | length
          },
          "repos_missing_file": _mf_missing | sort,
          "repos_with_file": _mf_present | sort
        } | to_nice_json
      }}

- name: Missing-file | print summary
  ansible.builtin.debug:
    msg: >-
      {{ _mf_missing | length }} of {{ targets_by_repo | length }} repo(s)
      are missing {{ reporker_action.target_patterns | default([]) | join(', ') }}
      → {{ paths.reports }}/missing-file.json

- name: Missing-file | set changed_files (read-only)
  ansible.builtin.set_fact:
    changed_files: []
