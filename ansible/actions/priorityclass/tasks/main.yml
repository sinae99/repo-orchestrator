---
# Action: priorityclass
# Read-only scan — classifies Kubernetes manifests by effective priorityClassName.
# Rule: pod templates without priorityClassName are treated as medium.
#
# Configure in group_vars:
#   reporker_action:
#     name: priorityclass
#     target_patterns: ["*.yaml", "*.yml"]
#     params:
#       priority_classes: [critical, high, medium, low]   # optional filter for matches_per_class
#
# Output:
#   02-priorityclass-breakdown.json  — full division across all tiers
#   03-priorityclass.json            — filtered view of configured classes

- name: PriorityClass | resolve classifier script
  ansible.builtin.set_fact:
    _pc_script: "{{ playbook_dir }}/../actions/_shared/files/priority_class.py"
    _pc_classes: "{{ reporker_action.params.priority_classes | default(['critical', 'high', 'medium', 'low']) }}"
    _pc_missing: "{{ reporker_action.params.missing_priority_class | default('medium') }}"

- name: PriorityClass | require PyYAML
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - import yaml
  changed_when: false

- name: PriorityClass | debug scan start
  ansible.builtin.debug:
    msg: >-
      Classifying {{ all_targets | length }} manifest(s) by effective priorityClassName
      (missing → {{ _pc_missing }}); tiers: {{ _pc_classes | join(', ') }}

- name: PriorityClass | write full priority breakdown report
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../actions/_shared/tasks/priority_breakdown.yml"

- name: PriorityClass | load breakdown findings
  ansible.builtin.slurp:
    src: "{{ paths.reports }}/{{ reporker_report.breakdown }}"
  register: _pc_breakdown_raw

- name: PriorityClass | set breakdown data
  ansible.builtin.set_fact:
    _pc_breakdown: "{{ (_pc_breakdown_raw.content | b64decode | from_json) }}"

- name: PriorityClass | filter findings to configured classes
  ansible.builtin.set_fact:
    _pc_findings: "{{ dict(_pc_classes | zip(_pc_classes | map('extract', _pc_breakdown.findings) | list)) }}"
    _pc_summary: "{{ dict(_pc_classes | zip(_pc_classes | map('extract', _pc_breakdown.findings) | map('length') | list)) }}"

- name: PriorityClass | write action report
  check_mode: false
  ansible.builtin.copy:
    dest: "{{ paths.reports }}/{{ reporker_report.action }}"
    mode: "0644"
    content: |
      {{
        {
          "action": "priorityclass",
          "rule": _pc_breakdown.rule,
          "priority_classes_searched": _pc_classes,
          "summary": {
            "total_manifests_scanned": all_targets | length,
            "manifests_with_pod_templates": _pc_breakdown.summary.manifests_with_pod_templates,
            "matches_per_class": _pc_summary,
            "full_breakdown": _pc_breakdown.summary.counts_per_class,
            "medium_breakdown": _pc_breakdown.summary.medium_breakdown
          },
          "findings": _pc_findings,
          "breakdown_report": reporker_report.breakdown
        } | to_nice_json
      }}

- name: PriorityClass | print summary
  ansible.builtin.debug:
    msg: >-
      critical={{ _pc_breakdown.summary.counts_per_class.critical | default(0) }}
      high={{ _pc_breakdown.summary.counts_per_class.high | default(0) }}
      medium={{ _pc_breakdown.summary.counts_per_class.medium | default(0) }}
      ({{ _pc_breakdown.summary.medium_breakdown.implicit_no_priorityClassName | default(0) }} without priorityClass)
      low={{ _pc_breakdown.summary.counts_per_class.low | default(0) }}
      — breakdown: {{ paths.reports }}/{{ reporker_report.breakdown }}
      — action: {{ paths.reports }}/{{ reporker_report.action }}

- name: PriorityClass | set changed_files (read-only — no modifications)
  ansible.builtin.set_fact:
    changed_files: []
