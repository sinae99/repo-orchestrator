---
# Action: priorityclass
# Write action. One pass per manifest:
#   1. remove container resource requests for medium/low pods
#   2. add priorityClassName: medium where pod templates omit it
# Manifests without priorityClassName are treated as medium for step 1.
# Honors --dry-run (reporker action --dry-run) via Ansible check mode.
#
# Configure in group_vars:
#   reporker_action:
#     name: priorityclass
#     target_patterns: ["*.yaml", "*.yml"]
#
# Output:
#   02-breakdown.json
#   03-action.json

- name: PriorityClass | resolve script paths
  ansible.builtin.set_fact:
    _pc_script: "{{ playbook_dir }}/../actions/priorityclass/files/priorityclass.py"
    _pc_ensure: "{{ reporker_action.params.ensure_priority_class | default('medium') }}"
    _pc_drop: "{{ reporker_action.params.drop_requests_for | default(['medium', 'low']) }}"
    _pc_missing: "{{ reporker_action.params.missing_priority_class | default('medium') }}"

- name: PriorityClass | require PyYAML
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - import yaml
  changed_when: false

- name: PriorityClass | debug scan start
  ansible.builtin.debug:
    msg: >-
      Processing {{ all_targets | length }} manifest(s);
      drop requests for {{ _pc_drop | join(', ') }},
      then ensure priorityClassName={{ _pc_ensure | default('(skip)', true) }}
      (missing priorityClassName → {{ _pc_missing }})

- name: PriorityClass | write breakdown report
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../actions/priorityclass/tasks/breakdown.yml"

- name: PriorityClass | load breakdown for targeting
  ansible.builtin.slurp:
    src: "{{ paths.reports }}/{{ reporker_report.breakdown }}"
  register: _pc_breakdown_raw

- name: PriorityClass | parse breakdown data
  ansible.builtin.set_fact:
    _pc_breakdown: "{{ (_pc_breakdown_raw.content | b64decode | from_json) }}"

- name: PriorityClass | derive ensure targets missing priorityClassName
  ansible.builtin.set_fact:
    _pc_ensure_targets: "{{ _pc_ensure_targets | default([]) + [item.file] }}"
  loop: "{{ _pc_breakdown.by_manifest | default([]) }}"
  when:
    - _pc_ensure | length > 0
    - item.templates is defined
    - item.templates | selectattr('explicit', 'equalto', false) | list | length > 0

- name: PriorityClass | derive drop-request targets
  ansible.builtin.set_fact:
    _pc_drop_targets: "{{ _pc_drop | map('extract', _pc_breakdown.findings) | flatten | unique | list }}"

- name: PriorityClass | merge target manifests
  ansible.builtin.set_fact:
    _pc_targets: "{{ ((_pc_ensure_targets | default([])) + (_pc_drop_targets | default([]))) | unique | list }}"

- name: PriorityClass | set changed_files (none)
  ansible.builtin.set_fact:
    changed_files: []
    _pc_details: {}
  when: _pc_targets | length == 0

- name: PriorityClass | apply changes to each matching manifest
  ansible.builtin.command:
    argv: >-
      {{
        ['python3', _pc_script, 'apply', item, '--missing-class', _pc_missing,
         '--ensure-priority-class', _pc_ensure | default('', true),
         '--drop-priority-classes', _pc_drop | join(','), '--report-json']
        + (['--check'] if ansible_check_mode else [])
      }}
  loop: "{{ _pc_targets }}"
  register: _pc_results
  changed_when: false
  failed_when: false
  check_mode: false
  when: _pc_targets | length > 0

- name: PriorityClass | fail on script errors
  ansible.builtin.fail:
    msg: >-
      priorityclass.py failed on {{ item.item }}
      (rc={{ item.rc }}): {{ item.stderr | default('') | trim }}
  loop: "{{ _pc_results.results }}"
  when:
    - _pc_targets | length > 0
    - item.rc | default(0) | int not in [0, 3]

- name: PriorityClass | record changed manifests
  ansible.builtin.set_fact:
    changed_files: "{{ changed_files | default([]) + [item.item] }}"
    _pc_details: "{{ _pc_details | default({}) | combine({item.item: (item.stdout | default('{}') | from_json)}) }}"
  loop: "{{ _pc_results.results | default([]) }}"
  when:
    - _pc_targets | length > 0
    - item.rc | default(0) | int == 3

- name: PriorityClass | write action report
  check_mode: false
  ansible.builtin.copy:
    dest: "{{ paths.reports }}/{{ reporker_report.action }}"
    mode: "0644"
    content: |
      {{
        {
          "action": "priorityclass",
          "rule": "drop resource requests for medium/low, then add priorityClassName where absent",
          "ensure_priority_class": _pc_ensure,
          "drop_requests_for": _pc_drop,
          "missing_priority_class_maps_to": _pc_missing,
          "check_mode": ansible_check_mode,
          "summary": {
            "total_manifests_scanned": all_targets | length,
            "manifests_targeted": _pc_targets | default([]) | length,
            "manifests_changed": changed_files | length,
            "ensure_targets": _pc_ensure_targets | default([]) | length,
            "drop_targets": _pc_drop_targets | default([]) | length,
            "priority_breakdown": priority_breakdown_summary | default({})
          },
          "targets": _pc_targets | default([]),
          "changes_by_file": _pc_details | default({}),
          "changed_files": changed_files,
          "breakdown_report": reporker_report.breakdown
        } | to_nice_json
      }}

- name: PriorityClass | print summary
  ansible.builtin.debug:
    msg: >-
      {{ changed_files | length }} of {{ _pc_targets | default([]) | length }} manifest(s)
      {{ 'would change' if ansible_check_mode else 'changed' }}
      (scanned {{ all_targets | length }} total)
      → {{ paths.reports }}/{{ reporker_report.action }}
      · breakdown → {{ paths.reports }}/{{ reporker_report.breakdown }}
