---
# Write 02-breakdown.json (used by priorityclass action only).

- name: PriorityClass | write manifest path list for breakdown
  ansible.builtin.set_fact:
    _pc_breakdown_list: "{{ paths.reports }}/.priority_breakdown_targets"

- name: PriorityClass | save manifest paths
  check_mode: false
  ansible.builtin.copy:
    dest: "{{ _pc_breakdown_list }}"
    mode: "0600"
    content: "{% for path in all_targets %}{{ path }}\n{% endfor %}"
  when: all_targets | length > 0

- name: PriorityClass | write breakdown report
  check_mode: false
  ansible.builtin.command:
    argv:
      - python3
      - "{{ _pc_script }}"
      - breakdown
      - --output
      - "{{ paths.reports }}/{{ reporker_report.breakdown }}"
      - --missing-class
      - "{{ _pc_missing }}"
      - --file-list
      - "{{ _pc_breakdown_list }}"
  register: _pc_breakdown_run
  changed_when: false
  when: all_targets | length > 0

- name: PriorityClass | write empty breakdown when no targets
  check_mode: false
  ansible.builtin.copy:
    dest: "{{ paths.reports }}/{{ reporker_report.breakdown }}"
    mode: "0644"
    content: |
      {{
        {
          "rule": "manifests without priorityClassName are classified as medium",
          "missing_priority_class_maps_to": _pc_missing,
          "priority_classes": ["critical", "high", "medium", "low"],
          "summary": {
            "total_manifests_scanned": 0,
            "manifests_with_pod_templates": 0,
            "total_pod_templates": 0,
            "counts_per_class": {"critical": 0, "high": 0, "medium": 0, "low": 0},
            "medium_breakdown": {
              "explicit_priorityClassName_medium": 0,
              "implicit_no_priorityClassName": 0,
              "total_medium_templates": 0
            }
          },
          "findings": {"critical": [], "high": [], "medium": [], "low": []},
          "other_classes": {},
          "by_manifest": []
        } | to_nice_json
      }}
  when: all_targets | length == 0

- name: PriorityClass | load breakdown summary
  ansible.builtin.slurp:
    src: "{{ paths.reports }}/{{ reporker_report.breakdown }}"
  register: _pc_breakdown_slurp

- name: PriorityClass | set breakdown summary facts
  ansible.builtin.set_fact:
    priority_breakdown_summary: "{{ (_pc_breakdown_slurp.content | b64decode | from_json).summary }}"

- name: PriorityClass | remove temporary manifest list
  ansible.builtin.file:
    path: "{{ _pc_breakdown_list }}"
    state: absent
