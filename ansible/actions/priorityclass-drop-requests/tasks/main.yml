---
# Action: priorityclass-drop-requests
# Write action. For Kubernetes manifests whose pod template has an effective
# priority class of medium or low, remove container resource requests and keep limits.
# Rule: pod templates without priorityClassName are treated as medium.
# Honors --dry-run (reporker action --dry-run) via Ansible check mode.
#
# Configure in group_vars:
#   reporker_action:
#     name: priorityclass-drop-requests
#     target_patterns: ["*.yaml", "*.yml"]
#     params:
#       priority_classes: [medium, low]
#
# Output:
#   02-breakdown.json
#   03-action.json

- name: PriorityClassDropRequests | resolve script paths
  ansible.builtin.set_fact:
    _pcdr_script: "{{ playbook_dir }}/../actions/priorityclass-drop-requests/files/drop_requests.py"
    _pc_classes: "{{ reporker_action.params.priority_classes | default(['medium', 'low']) }}"
    _pc_missing: "{{ reporker_action.params.missing_priority_class | default('medium') }}"

- name: PriorityClassDropRequests | require PyYAML
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - import yaml
  changed_when: false

- name: PriorityClassDropRequests | debug scan start
  ansible.builtin.debug:
    msg: >-
      Processing {{ all_targets | length }} manifest(s);
      dropping requests for effective priority: {{ _pc_classes | join(', ') }}
      (missing priorityClassName → {{ _pc_missing }})

- name: PriorityClassDropRequests | write full priority breakdown report
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../actions/_shared/tasks/priority_breakdown.yml"

- name: PriorityClassDropRequests | load breakdown for targeting
  ansible.builtin.slurp:
    src: "{{ paths.reports }}/{{ reporker_report.breakdown }}"
  register: _pc_breakdown_raw

- name: PriorityClassDropRequests | parse breakdown data
  ansible.builtin.set_fact:
    _pc_breakdown: "{{ (_pc_breakdown_raw.content | b64decode | from_json) }}"

- name: PriorityClassDropRequests | derive targets from breakdown
  ansible.builtin.set_fact:
    _pc_findings: "{{ dict(_pc_classes | zip(_pc_classes | map('extract', _pc_breakdown.findings) | list)) }}"
    _pc_targets: "{{ _pc_classes | map('extract', _pc_breakdown.findings) | flatten | unique | list }}"

- name: PriorityClassDropRequests | set changed_files (none)
  ansible.builtin.set_fact:
    changed_files: []
  when: _pc_targets | length == 0

- name: PriorityClassDropRequests | drop resource requests in each matching manifest
  ansible.builtin.command:
    argv: >-
      {{
        [
          'python3',
          _pcdr_script,
          item,
          '--priority-classes',
          _pc_classes | join(','),
          '--missing-class',
          _pc_missing,
        ]
        + (['--check'] if ansible_check_mode else [])
      }}
  loop: "{{ _pc_targets }}"
  register: _pcdr_results
  changed_when: false
  failed_when: false
  check_mode: false
  when: _pc_targets | length > 0

- name: PriorityClassDropRequests | fail on script errors
  ansible.builtin.fail:
    msg: >-
      drop_requests.py failed on {{ item.item }}
      (rc={{ item.rc }}): {{ item.stderr | default('') | trim }}
  loop: "{{ _pcdr_results.results }}"
  when:
    - _pc_targets | length > 0
    - item.rc | int not in [0, 3]

- name: PriorityClassDropRequests | set changed_files from results
  ansible.builtin.set_fact:
    changed_files: >-
      {{
        _pcdr_results.results
        | selectattr('rc', 'defined')
        | selectattr('rc', 'equalto', 3)
        | map(attribute='item')
        | list
      }}
  when: _pc_targets | length > 0

- name: PriorityClassDropRequests | write action report
  check_mode: false
  ansible.builtin.copy:
    dest: "{{ paths.reports }}/{{ reporker_report.action }}"
    mode: "0644"
    content: |
      {{
        {
          "action": "priorityclass-drop-requests",
          "rule": "manifests without priorityClassName are classified as " ~ _pc_missing,
          "priority_classes": _pc_classes,
          "missing_priority_class_maps_to": _pc_missing,
          "check_mode": ansible_check_mode,
          "summary": {
            "total_manifests_scanned": all_targets | length,
            "manifests_with_matching_effective_class": _pc_targets | default([]) | length,
            "manifests_changed": changed_files | length,
            "priority_breakdown": priority_breakdown_summary | default({})
          },
          "findings": _pc_findings | default({}),
          "changed_files": changed_files,
          "breakdown_report": reporker_report.breakdown
        } | to_nice_json
      }}

- name: PriorityClassDropRequests | print summary
  ansible.builtin.debug:
    msg: >-
      {{ changed_files | length }} of {{ _pc_targets | default([]) | length }} matching manifest(s)
      {{ 'would change' if ansible_check_mode else 'changed' }}
      (scanned {{ all_targets | length }} total)
      → {{ paths.reports }}/{{ reporker_report.action }}
      · breakdown → {{ paths.reports }}/{{ reporker_report.breakdown }}
