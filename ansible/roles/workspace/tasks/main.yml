---
# Phase 2: Clone/update repositories into the local workspace

- name: Workspace | verify repos.txt exists
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../glab/repos.txt"
  register: repos_txt_stat

- name: Workspace | fail if repos.txt is missing
  ansible.builtin.fail:
    msg: "glab/repos.txt not found. Run the discovery phase first (--tags discovery)."
  when: not repos_txt_stat.stat.exists

- name: Workspace | read repos.txt
  ansible.builtin.slurp:
    path: "{{ playbook_dir }}/../../glab/repos.txt"
  register: repos_txt_slurp

- name: Workspace | parse repo URLs
  ansible.builtin.set_fact:
    repo_urls: >-
      {{
        (repos_txt_slurp.content | b64decode).splitlines()
        | map('trim')
        | reject('equalto', '')
        | list
      }}

- name: Workspace | show repo URL count
  ansible.builtin.debug:
    msg: "{{ repo_urls | length }} repo(s) to clone/update."

# Derive a local folder name from the SSH URL:
# git@gitlab.com:group/name.git  →  name
- name: Workspace | clone or fetch-prune repos
  ansible.builtin.shell: |
    set -euo pipefail

    url="{{ item }}"
    repo_name="$(basename "$url")"
    repo_name="${repo_name%.git}"
    dest="{{ paths.workspace }}/$repo_name"

    if [ -d "$dest/.git" ]; then
      echo "==> FETCH  $repo_name"
      git -C "$dest" fetch --all --prune
    else
      echo "==> CLONE  $repo_name"
      git clone "$url" "$dest"
    fi
  args:
    executable: /bin/bash
  loop: "{{ repo_urls }}"
  register: workspace_ops
  changed_when: "'==> CLONE' in workspace_ops.stdout"
