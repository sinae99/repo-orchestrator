---
# Phase 1: Preconditions + repository discovery

- name: Preflight | validate GitLab config
  ansible.builtin.assert:
    that:
      - gitlab.host is defined
      - gitlab.host | length > 0
      - gitlab.group_id is defined
      - (gitlab.group_id | string) | length > 0
      - (gitlab.group_id | string) != "12345"
    fail_msg: >-
      Edit ansible/group_vars/all.yml first: set gitlab.host and a real
      gitlab.group_id (12345 is the placeholder from the example config).
    quiet: true

- name: Preflight | verify glab is installed
  ansible.builtin.command: glab --version
  register: glab_version
  changed_when: false

- name: Preflight | verify git is installed
  ansible.builtin.command: git --version
  register: git_version
  changed_when: false

- name: Preflight | verify jq is installed
  ansible.builtin.command: jq --version
  register: jq_version
  changed_when: false

- name: Preflight | verify GitLab token file exists
  ansible.builtin.stat:
    path: "{{ gitlab.token_file }}"
  register: gitlab_token_stat

- name: Preflight | fail if token file is missing
  ansible.builtin.fail:
    msg: "Token file not found at {{ gitlab.token_file }}. Create it: printf '%s' 'glpat-xxx' > glab/token && chmod 600 glab/token"
  when: not gitlab_token_stat.stat.exists

# Read the token once and hand it to glab via GITLAB_TOKEN. This means a plain
# token file is the only auth step — no separate `glab auth login` required.
- name: Preflight | load GitLab token
  ansible.builtin.slurp:
    path: "{{ gitlab.token_file }}"
  register: gitlab_token_slurp
  no_log: true

- name: Preflight | set GitLab token fact
  ansible.builtin.set_fact:
    gitlab_token: "{{ (gitlab_token_slurp.content | b64decode) | trim }}"
  no_log: true

- name: Preflight | fail if token file is empty
  ansible.builtin.fail:
    msg: "Token file {{ gitlab.token_file }} is empty. Write your token: printf '%s' 'glpat-xxx' > glab/token"
  when: gitlab_token | length == 0

- name: Ensure output directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ paths.reports }}"
    - "{{ paths.workspace }}"
    - "{{ playbook_dir }}/../../glab"

# Skip the API call when repos.json is already present — useful when the
# GitLab instance is unreachable and you want to re-filter an existing snapshot.
# Force a fresh fetch by deleting ansible/reports/repos.json first.
- name: Discovery | check for cached repos.json
  ansible.builtin.stat:
    path: "{{ paths.reports }}/repos.json"
  register: _repos_json_cached

- name: Discovery | fetch group projects via glab API (raw JSON)
  ansible.builtin.command: >
    glab api "groups/{{ gitlab.group_id }}/projects?per_page=100"
    --hostname {{ gitlab.host }}
    --paginate
  environment:
    GITLAB_TOKEN: "{{ gitlab_token }}"
  register: glab_projects
  changed_when: false
  no_log: true
  when: not _repos_json_cached.stat.exists

- name: Discovery | write repos.json (raw paginated output)
  ansible.builtin.copy:
    dest: "{{ paths.reports }}/repos.json"
    content: "{{ glab_projects.stdout }}\n"
    mode: "0644"
  when: not _repos_json_cached.stat.exists

# glab --paginate concatenates one JSON array per page: [...][...]
# Normalize into a single flat array so subsequent jq steps see valid JSON.
- name: Discovery | normalize repos.json (merge paginated arrays into one)
  ansible.builtin.shell: |
    set -euo pipefail
    jq -s '[.[] | .[]]' "{{ paths.reports }}/repos.json" \
      > "{{ paths.reports }}/repos.json.tmp"
    mv "{{ paths.reports }}/repos.json.tmp" "{{ paths.reports }}/repos.json"
  args:
    executable: /bin/bash
  changed_when: true
  when: not _repos_json_cached.stat.exists

# Slim repos.json to essential fields — drops the ~60 noise fields the API returns.
# Runs whether the data was just fetched or loaded from cache.
- name: Discovery | slim repos.json to essential fields
  ansible.builtin.shell: |
    set -euo pipefail
    jq 'map({
      id, name, archived,
      path_with_namespace,
      ssh_url_to_repo,
      http_url_to_repo,
      web_url,
      default_branch,
      last_activity_at,
      description,
      visibility
    })' "{{ paths.reports }}/repos.json" \
      > "{{ paths.reports }}/repos.json.tmp"
    mv "{{ paths.reports }}/repos.json.tmp" "{{ paths.reports }}/repos.json"
  args:
    executable: /bin/bash
  changed_when: false

# repos.txt is always regenerated — re-apply the filter even on a cached snapshot.
# Filter criteria:
#   - archived == false
#   - path_with_namespace does not contain "deletion_scheduled"
#   - name matches gitlab.repo_filter (case-insensitive; skipped when list is empty)
- name: Discovery | write repos.txt (SSH clone URLs, honours repo_filter)
  ansible.builtin.shell: |
    set -euo pipefail
    jq -r \
      --argjson names '{{ gitlab.repo_filter | default([]) | to_json }}' \
      '
        .[]
        | select(.archived == false)
        | select((.path_with_namespace | tostring) | contains("deletion_scheduled") | not)
        | select(
            ($names | length) == 0
            or (.name | ascii_downcase | IN($names[] | ascii_downcase))
          )
        | .ssh_url_to_repo
      ' "{{ paths.reports }}/repos.json" > "{{ playbook_dir }}/../../glab/repos.txt"
  args:
    executable: /bin/bash
  changed_when: true

- name: Discovery | show repo counts (selected / total in group)
  ansible.builtin.shell: |
    set -euo pipefail
    total=$(jq '. | length' "{{ paths.reports }}/repos.json")
    selected=$(wc -l < "{{ playbook_dir }}/../../glab/repos.txt" | tr -d ' ')
    echo "${selected}/${total}"
  args:
    executable: /bin/bash
  register: repo_count
  changed_when: false

- name: Discovery | report repo count
  ansible.builtin.debug:
    msg: >-
      Queued {{ repo_count.stdout }} repo(s) for cloning
      (filter: {{ gitlab.repo_filter | default([]) }},
      cached: {{ _repos_json_cached.stat.exists }})
      → glab/repos.txt
