---
# Phase 4: Run a pluggable action from ansible/actions/<reporker_action.name>/

- name: Action | check scan report exists
  ansible.builtin.stat:
    path: "{{ paths.reports }}/{{ reporker_report.scan }}"
  register: scan_report_stat

- name: Action | fail if scan report missing
  ansible.builtin.fail:
    msg: "Scan report not found at {{ paths.reports }}/{{ reporker_report.scan }}. Run ./reporker scan or ./reporker action first."
  when: not scan_report_stat.stat.exists

- name: Action | load scan report
  ansible.builtin.include_vars:
    file: "{{ paths.reports }}/{{ reporker_report.scan }}"
    name: scan_report

- name: Action | set targets_by_repo and repos_with_targets from scan report
  ansible.builtin.set_fact:
    targets_by_repo: "{{ scan_report.targets_by_repo | default({}) }}"
    repos_with_targets: >-
      {{
        (scan_report.targets_by_repo | default({}))
        | dict2items
        | rejectattr('value', 'equalto', [])
        | map(attribute='key')
        | list
      }}

- name: Action | assert scan data present
  ansible.builtin.assert:
    that:
      - targets_by_repo is defined
    fail_msg: "targets_by_repo missing from {{ reporker_report.scan }}."

- name: Action | build flat target list
  ansible.builtin.set_fact:
    all_targets: "{{ targets_by_repo.values() | list | flatten }}"

- name: Action | debug target count
  ansible.builtin.debug:
    msg: "Running '{{ reporker_action.name | default('noop') }}' on {{ all_targets | length }} target file(s)."

- name: Action | resolve tasks file
  ansible.builtin.set_fact:
    action_tasks_file: >-
      {{
        reporker_action.tasks_file
        if (reporker_action.tasks_file is defined and reporker_action.tasks_file | length > 0)
        else (playbook_dir ~ '/../actions/' ~ (reporker_action.name | default('noop')) ~ '/tasks/main.yml')
      }}

- name: Action | verify action tasks file exists
  ansible.builtin.stat:
    path: "{{ action_tasks_file }}"
  register: action_tasks_stat

- name: Action | fail if action tasks missing
  ansible.builtin.fail:
    msg: >-
      No tasks found at {{ action_tasks_file }}.
      Create ansible/actions/{{ reporker_action.name | default('noop') }}/tasks/main.yml
      or set reporker_action.tasks_file to an explicit path.
  when: not action_tasks_stat.stat.exists

- name: Action | run pluggable action
  ansible.builtin.include_tasks: "{{ action_tasks_file }}"

- name: Action | normalize changed_files
  ansible.builtin.set_fact:
    changed_files: "{{ changed_files | default([]) }}"

# Attribute every changed file to the repo it lives under. This works whether
# the file was one of the scanned targets (line-append, replace) or a brand new
# file the action created (ensure-file), so all changes get published.
- name: Action | attribute changed files to their repos
  ansible.builtin.set_fact:
    changed_targets_by_repo: >-
      {{
        changed_targets_by_repo | default({})
        | combine({
            repo: (changed_files | select('match', (repo | regex_escape) ~ '/') | list)
          })
      }}
  loop: "{{ targets_by_repo | list }}"
  loop_control:
    loop_var: repo
  when: changed_files | length > 0

- name: Action | empty change map when nothing changed
  ansible.builtin.set_fact:
    changed_targets_by_repo: {}
  when: changed_files | length == 0

- name: Action | derive changed_repos
  ansible.builtin.set_fact:
    changed_targets_by_repo: "{{ changed_targets_by_repo | default({}) }}"
    changed_repos: "{{ changed_targets_by_repo | dict2items | rejectattr('value', 'equalto', []) | map(attribute='key') | list }}"

- name: Action | write action metadata report
  check_mode: false
  ansible.builtin.copy:
    dest: "{{ paths.reports }}/{{ reporker_report.action_meta }}"
    mode: "0644"
    content: |
      {{
        {
          "action": {
            "name":            reporker_action.name | default('noop'),
            "tasks_file":      action_tasks_file,
            "target_patterns": reporker_action.target_patterns | default([]),
            "params":          reporker_action.params | default({})
          },
          "summary": {
            "total_targets":       all_targets | length,
            "changed_files_count": changed_files | length,
            "changed_repos_count": changed_repos | length
          },
          "changed_targets_by_repo": changed_targets_by_repo
        } | to_nice_json
      }}
