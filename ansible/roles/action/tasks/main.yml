---
# Phase 4: Run a pluggable action from ansible/actions/<action.name>/

- name: Action | check scan report exists
  ansible.builtin.stat:
    path: "{{ paths.reports }}/scan.json"
  register: scan_report_stat

- name: Action | fail if scan report missing
  ansible.builtin.fail:
    msg: "Scan report not found at {{ paths.reports }}/scan.json. Run scan stage first."
  when: not scan_report_stat.stat.exists

- name: Action | load scan report JSON
  ansible.builtin.include_vars:
    file: "{{ paths.reports }}/scan.json"
    name: scan_report

- name: Action | set targets_by_repo and repos_with_targets from scan report
  ansible.builtin.set_fact:
    targets_by_repo: "{{ scan_report.targets_by_repo | default({}) }}"
    repos_with_targets: >-
      {{
        (scan_report.targets_by_repo | default({}))
        | dict2items
        | rejectattr('value', 'equalto', [])
        | map(attribute='key')
        | list
      }}

- name: Action | assert scan data present
  ansible.builtin.assert:
    that:
      - targets_by_repo is defined
    fail_msg: "targets_by_repo missing from scan report."

- name: Action | build flat target list
  ansible.builtin.set_fact:
    all_targets: "{{ targets_by_repo.values() | list | flatten }}"

- name: Action | debug target count
  ansible.builtin.debug:
    msg: "Action '{{ action.name | default('unset') }}': {{ all_targets | length }} target file(s)."

- name: Action | resolve tasks file for this action
  ansible.builtin.set_fact:
    action_tasks_file: >-
      {{
        action.tasks_file
        if (action.tasks_file is defined and action.tasks_file | length > 0)
        else (playbook_dir ~ '/../actions/' ~ (action.name | default('noop')) ~ '/tasks/main.yml')
      }}

- name: Action | verify action tasks file exists
  ansible.builtin.stat:
    path: "{{ action_tasks_file }}"
  register: action_tasks_stat

- name: Action | fail if action tasks missing
  ansible.builtin.fail:
    msg: >-
      No tasks at {{ action_tasks_file }}.
      Create ansible/actions/{{ action.name | default('noop') }}/tasks/main.yml
      or set action.tasks_file to a playbook-relative path.
  when: not action_tasks_stat.stat.exists

- name: Action | run pluggable action tasks
  ansible.builtin.include_tasks: "{{ action_tasks_file }}"

- name: Action | normalize changed_files from action
  ansible.builtin.set_fact:
    changed_files: "{{ changed_files | default([]) }}"

- name: Action | build changed_targets_by_repo map
  ansible.builtin.set_fact:
    changed_targets_by_repo: "{{ changed_targets_by_repo | default({}) | combine({ repo: (targets_by_repo[repo] | intersect(changed_files)) }) }}"
  loop: "{{ repos_with_targets }}"
  loop_control:
    loop_var: repo
  when: all_targets | length > 0

- name: Action | empty change map when no targets
  ansible.builtin.set_fact:
    changed_targets_by_repo: {}
  when: all_targets | length == 0

- name: Action | derive changed_repos
  ansible.builtin.set_fact:
    changed_targets_by_repo: "{{ changed_targets_by_repo | default({}) }}"
    changed_repos: "{{ changed_targets_by_repo | dict2items | rejectattr('value', 'equalto', []) | map(attribute='key') | list }}"

- name: Action | write action report (JSON)
  ansible.builtin.copy:
    dest: "{{ paths.reports }}/action.json"
    mode: "0644"
    content: |
      {{
        {
          "action": {
            "name": action.name | default('noop'),
            "tasks_file": action_tasks_file,
            "target_patterns": action.target_patterns | default([]),
            "params": action.params | default({})
          },
          "summary": {
            "total_targets": all_targets | length,
            "changed_files_count": changed_files | length,
            "changed_repos_count": changed_repos | length
          },
          "changed_targets_by_repo": changed_targets_by_repo
        } | to_nice_json
      }}
