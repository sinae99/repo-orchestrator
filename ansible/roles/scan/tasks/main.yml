---
# Phase 3: Target file discovery

- name: Scan | ensure workspace exists
  ansible.builtin.stat:
    path: "{{ paths.workspace }}"
  register: workspace_stat

- name: Scan | fail if workspace is missing
  ansible.builtin.fail:
    msg: "Workspace directory not found at {{ paths.workspace }}. Run ./reporker clone first."
  when: not workspace_stat.stat.exists

- name: Scan | list repositories in workspace
  ansible.builtin.find:
    paths: "{{ paths.workspace }}"
    file_type: directory
    depth: 1
  register: repo_dirs

- name: Scan | build repo list
  ansible.builtin.set_fact:
    repos: "{{ repo_dirs.files | map(attribute='path') | list }}"

- name: Scan | fail if no repos exist in workspace
  ansible.builtin.fail:
    msg: "No repositories found in workspace ({{ paths.workspace }})."
  when: repos | length == 0

- name: Scan | find targets in each repo
  ansible.builtin.find:
    paths: "{{ item }}"
    patterns: "{{ reporker_action.target_patterns }}"
    recurse: true
    file_type: file
  loop: "{{ repos }}"
  register: target_find_results

# Build mapping: repo_path -> [file paths]
- name: Scan | build targets_by_repo map
  ansible.builtin.set_fact:
    targets_by_repo: >-
      {{
        dict(
          target_find_results.results
          | map(attribute='item')
          | zip(
              target_find_results.results
              | map(attribute='files')
              | map('map', attribute='path')
              | map('list')
            )
        )
      }}

# Skipped for priorityclass* actions — those need manifests WITHOUT priorityClassName too
# (missing priorityClassName is treated as medium). Instead, keep K8s workload manifests
# and anything that already sets priorityClassName.
- name: Scan | grep targets for content match
  ansible.builtin.shell: |
    set -euo pipefail
    list={{ targets_by_repo[item] | to_json | quote }}
    count=$(echo "$list" | jq 'length')
    if [ "$count" -eq 0 ]; then exit 0; fi
    echo "$list" | jq -r '.[]' \
      | xargs -r grep -El {{ reporker_action.content_grep | quote }} 2>/dev/null \
      || true
  args:
    executable: /bin/bash
  loop: "{{ repos }}"
  register: _content_grep_results
  changed_when: false
  check_mode: false
  when:
    - reporker_action.content_grep is defined
    - reporker_action.content_grep | length > 0
    - not reporker_is_priority_action | bool

- name: Scan | filter to K8s workload manifests for priority actions
  ansible.builtin.shell: |
    set -euo pipefail
    list={{ targets_by_repo[item] | to_json | quote }}
    count=$(echo "$list" | jq 'length')
    if [ "$count" -eq 0 ]; then exit 0; fi
    echo "$list" | jq -r '.[]' | while IFS= read -r f; do
      if grep -qE '^[[:space:]]*priorityClassName:[[:space:]]*' "$f" 2>/dev/null; then
        echo "$f"
        continue
      fi
      if grep -qE '^[[:space:]]*kind:[[:space:]]*(Deployment|StatefulSet|DaemonSet|Job|CronJob|Pod)([[:space:]]|$)' "$f" 2>/dev/null; then
        echo "$f"
      fi
    done
  args:
    executable: /bin/bash
  loop: "{{ repos }}"
  register: _priority_workload_results
  changed_when: false
  check_mode: false
  when: reporker_is_priority_action | bool

- name: Scan | rebuild targets_by_repo to content-matched files only
  ansible.builtin.set_fact:
    targets_by_repo: >-
      {{
        targets_by_repo | combine({
          item.item: (item.stdout_lines | map('trim') | reject('equalto', '') | list)
        })
      }}
  loop: "{{ _content_grep_results.results }}"
  when:
    - reporker_action.content_grep is defined
    - reporker_action.content_grep | length > 0
    - not reporker_is_priority_action | bool

- name: Scan | rebuild targets_by_repo to workload manifests for priority actions
  ansible.builtin.set_fact:
    targets_by_repo: >-
      {{
        targets_by_repo | combine({
          item.item: (item.stdout_lines | map('trim') | reject('equalto', '') | list)
        })
      }}
  loop: "{{ _priority_workload_results.results }}"
  when:
    - reporker_is_priority_action | bool
    - _priority_workload_results is not skipped

- name: Scan | derive repos_with_targets and repos_without_targets
  ansible.builtin.set_fact:
    repos_with_targets:    "{{ targets_by_repo | dict2items | rejectattr('value', 'equalto', []) | map(attribute='key') | list }}"
    repos_without_targets: "{{ targets_by_repo | dict2items | selectattr('value', 'equalto', []) | map(attribute='key') | list }}"

- name: Scan | write scan report
  check_mode: false
  ansible.builtin.copy:
    dest: "{{ paths.reports }}/{{ reporker_report.scan }}"
    mode: "0644"
    content: |
      {{
        {
          "workspace": paths.workspace,
          "target_patterns": reporker_action.target_patterns,
          "content_grep": reporker_action.content_grep | default(''),
          "priority_scan": reporker_is_priority_action | bool,
          "priority_rule": (
            "missing priorityClassName counts as medium"
            if reporker_is_priority_action
            else none
          ),
          "repos_total": repos | length,
          "repos_with_targets": repos_with_targets | length,
          "repos_without_targets": repos_without_targets | length,
          "targets_by_repo": targets_by_repo
        } | to_nice_json
      }}

- name: Scan | write summary.txt (scan-only entry point)
  check_mode: false
  ansible.builtin.template:
    src: summary.txt.j2
    dest: "{{ paths.reports }}/{{ reporker_report.summary }}"
    mode: "0644"
  vars:
    generated_at: "{{ lookup('pipe', 'date -Iseconds') }}"
    summary_scope: >-
      {{
        (reporker_action.target_patterns | default([]) | join(', ') if (reporker_action.target_patterns | default([]) | length) > 0 else '—')
        + (
          '  |  grep: ' ~ (reporker_action.content_grep | default(''))
          if (
            (reporker_action.content_grep | default('') | length > 0)
            and not (reporker_is_priority_action | bool)
          )
          else (
            '  |  K8s workloads + priorityClassName (missing → medium)'
            if (reporker_is_priority_action | bool)
            else ''
          )
        )
      }}
    repos_total: "{{ repos | length }}"
    repos_with_targets_count: "{{ repos_with_targets | length }}"
    repos_without_targets_count: "{{ repos_without_targets | length }}"
    files_matched: "{{ targets_by_repo.values() | list | flatten | length }}"
    scan_report_file: "{{ reporker_report.scan }}"

- name: Scan | print summary
  ansible.builtin.debug:
    msg:
      - "FOUND  {{ repos | length }} repos · {{ repos_with_targets | length }} matched · {{ targets_by_repo.values() | list | flatten | length }} files"
      - "NEXT   reporker action"
      - "READ   {{ paths.reports }}/{{ reporker_report.summary }}"
