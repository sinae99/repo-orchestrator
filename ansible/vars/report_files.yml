---
# Fixed report filenames — same slots for every action (name lives inside JSON).
# Read in order: 01 → 08. Optional slots are omitted from 01-summary.txt when absent.

reporker_is_priority_action: "{{ (reporker_action.name | default('')) is match('^priorityclass') }}"

reporker_write_actions:
  - line-append
  - replace
  - ensure-file
  - priorityclass

reporker_report:
  summary: "01-summary.txt"
  breakdown: "02-breakdown.json"
  action: "03-action.json"
  scan: "04-scan.json"
  changed: "05-changed.json"
  run: "06-run.json"
  meta: "07-meta.json"
  publish: "08-publish.json"

# Numbered artifacts cleared at the start of each scan/action run (repos.json kept).
reporker_report_artifacts:
  - "{{ reporker_report.summary }}"
  - "{{ reporker_report.breakdown }}"
  - "{{ reporker_report.action }}"
  - "{{ reporker_report.scan }}"
  - "{{ reporker_report.changed }}"
  - "{{ reporker_report.run }}"
  - "{{ reporker_report.meta }}"
  - "{{ reporker_report.publish }}"
