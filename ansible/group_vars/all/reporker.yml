# =============================================================================
# reporker — single configuration file
# =============================================================================

# --- GitLab connection (glab discovery only; git operations use SSH) ---
gitlab:
  host: gitlab.com                   # your GitLab instance hostname
  group_id: 12345                    # numeric group ID to scan
  # Personal access token file (needs api scope). Path relative to ansible/.
  # Create it with: printf '%s' 'glpat-xxx' > glab/token && chmod 600 glab/token
  token_file: "{{ playbook_dir }}/../../glab/token"
  # Filter repos to clone by name (last path segment of the project path).
  # Empty list = clone everything in the group.
  # Example: ["deployment", "infra-base"]
  repo_filter: []

# --- Local paths ---
paths:
  workspace: "{{ playbook_dir }}/../workspace"   # cloned repos land here
  reports:   "{{ playbook_dir }}/../reports"     # JSON output

# --- Git settings for the publish phase ---
git:
  branch_name:    "reporker-{{ lookup('pipe', 'date +%Y%m%d') }}"
  commit_message: "chore: reporker automated change"

# --- Pluggable action ---
# action.name        : folder under ansible/actions/<name>/
# action.target_patterns : globs passed to ansible.builtin.find (recurse=true)
# action.params      : arbitrary dict available as `action.params` in your tasks
action:
  name: noop
  target_patterns:
    - "*.___reporker_no_match___"
  params: {}

