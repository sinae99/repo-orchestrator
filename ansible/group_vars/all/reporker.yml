# =============================================================================
# Reporker — single configuration file (copy values you need; edit here only)
# =============================================================================

# --- GitLab API (glab discovery only; git uses SSH) ---
hamgit:
  host: hamgit.ir
  group_id: 44436
  # Path relative to ansible/ (playbook_dir); file must exist before discovery
  token_file: "{{ playbook_dir }}/../../glab/hamgit-token"

# --- Workspace & reports (paths relative to ansible/ unless you use absolute) ---
paths:
  workspace: "{{ playbook_dir }}/../workspace"
  reports: "{{ playbook_dir }}/../reports"

# --- Git branch / commit when publishing ---
git:
  branch_name: "reporker-{{ lookup('pipe', 'date +%Y%m%d') }}"
  commit_message: "chore: reporker automated change"

# --- Pluggable action (see ansible/actions/README.md) ---
# action.name: directory under ansible/actions/<name>/
# action.target_patterns: globs for the scan phase (ansible.builtin.find)
# action.params: arbitrary dict passed into your action tasks as `action.params`
action:
  name: noop
  target_patterns:
    - "*.___reporker_no_match___"
  params: {}

